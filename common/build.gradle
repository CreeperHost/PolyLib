plugins {
    id "com.gradleup.shadow" version "9.2.2"
    id "maven-publish"
}

loom {
    accessWidenerPath = file("src/main/resources/polylib.accesswidener")
}

configurations {
    shadowCommon
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation  "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
//    api "dev.architectury:architectury:${rootProject.architectury_version}"
    implementation "blue.endless:jankson:1.2.1"
    implementation('io.sentry:sentry:5.7.2')
    {
        exclude group: 'com.google', module: 'gson'
    }

//    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
}

architectury {
    common("fabric", "neoforge")
}

jar {
    archiveClassifier = "raw"
}

java {
    withSourcesJar()
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
