plugins {
    id "com.gradleup.shadow" version "9.2.2"
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id "me.shedaniel.unified-publishing"
}

def ENV = System.getenv()

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "blue.endless:jankson:1.2.1"
    shadow("blue.endless:jankson:1.2.1") { transitive = false }
    // Mod Menu — soft optional dependency; only needed at compile time for ModMenuCompat
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    compileOnly api('teamreborn:energy:5.0.0') {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    dependsOn(jar)
    configurations = [project.configurations.shadow]

    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    dependencies {
        exclude(dependency('com.google::'))
        exclude(dependency('org.apache::'))
    }
    relocate 'blue.endless.jankson', 'net.creeperhost.polylib.blue.endless.jankson'
    archiveClassifier = null
}

// Make the shadow jar the primary published artifact so consumers get Jankson bundled
configurations {
    [apiElements, runtimeElements].each { config ->
        config.outgoing.artifacts.clear()
        config.outgoing.artifact(shadowJar)
    }
}

assemble.dependsOn(shadowJar)

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-fabric"
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        if (ENV.CREEPERHOST_MAVEN_TOKEN) {
            maven {
                url "https://maven.creeperhost.net/release"
                credentials {
                    username = "githubci"
                    password = "${ENV.CREEPERHOST_MAVEN_TOKEN}"
                }
            }
        }
    }
}

unifiedPublishing {
    project {
        displayName = "$rootProject.version [Fabric]"
        releaseType = "$rootProject.artifact_type"
        changelog = ""
        gameVersions = ["$rootProject.minecraft_version"]
        gameLoaders = ["fabric"]
        mainPublication tasks.shadowJar
        relations {
            depends {
                curseforge = "fabric-api"
                modrinth = "fabric-api"
            }
        }

        var CURSE_API_KEY = project.findProperty("CURSE_API_KEY") ?: System.getenv("CURSE_API_KEY")
        if (CURSE_API_KEY != null) {
            curseforge {
                token = CURSE_API_KEY
                id = rootProject.curseforge_id
            }
        }

        var MODRINTH_TOKEN = project.findProperty("MODRINTH_TOKEN") ?: System.getenv("MODRINTH_TOKEN")
        if (MODRINTH_TOKEN != null) {
            modrinth {
                token = MODRINTH_TOKEN
                id = rootProject.modrinth_id
                version = "$project.version"
            }
        }
    }
}