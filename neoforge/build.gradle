plugins {
    id "com.gradleup.shadow" version "9.2.2"
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id "me.modmuss50.mod-publish-plugin"
}

def ENV = System.getenv()


neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers {
            from(at)
            publish(at)
        }
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file("runs/data"))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "blue.endless:jankson:1.2.1"
    shadow("blue.endless:jankson:1.2.1") { transitive = false }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    dependsOn(jar)
    configurations = [project.configurations.shadow]

    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    dependencies {
        exclude(dependency('com.google::'))
        exclude(dependency('org.apache::'))
    }
    relocate 'blue.endless.jankson', 'net.creeperhost.polylib.blue.endless.jankson'
    archiveClassifier = null
}

// Make the shadow jar the primary published artifact so consumers get Jankson bundled
configurations {
    [apiElements, runtimeElements].each { config ->
        config.outgoing.artifacts.clear()
        config.outgoing.artifact(shadowJar)
    }
}

assemble.dependsOn(shadowJar)

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

publishing {
    publications {
        named('mavenJava', MavenPublication) {
            artifactId = rootProject.archives_base_name + "-neoforge"
            version = "${rootProject.minecraft_version}-${rootProject.version}"
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        if (ENV.CREEPERHOST_MAVEN_TOKEN) {
            maven {
                url "https://maven.creeperhost.net/release"
                credentials {
                    username = "githubci"
                    password = "${ENV.CREEPERHOST_MAVEN_TOKEN}"
                }
            }
        }
    }
}

publishMods {
    file = shadowJar.archiveFile
    displayName = "$rootProject.version [NeoForge]"
    version = "$project.version"
    changelog = ""
    type = rootProject.artifact_type == "alpha" ? ALPHA : rootProject.artifact_type == "beta" ? BETA : STABLE
    dryRun = providers.gradleProperty("publishDryRun").map { it.toBoolean() }.orElse(false)
    modLoaders.add("neoforge")

    def curseApiKey = providers.gradleProperty("CURSE_API_KEY").orElse(providers.environmentVariable("CURSE_API_KEY"))
    if (curseApiKey.isPresent()) {
        curseforge {
            accessToken = curseApiKey
            projectId = rootProject.curseforge_id
            minecraftVersions.add("$rootProject.minecraft_version")
            client = true
            server = true
        }
    }

    def modrinthToken = providers.gradleProperty("MODRINTH_TOKEN").orElse(providers.environmentVariable("MODRINTH_TOKEN"))
    if (modrinthToken.isPresent()) {
        modrinth {
            accessToken = modrinthToken
            projectId = rootProject.modrinth_id
            minecraftVersions.add("$rootProject.minecraft_version")
            environment = CLIENT_AND_SERVER
        }
    }

}
